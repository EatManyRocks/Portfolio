<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Add a game to your library</title>
    <link rel="stylesheet" href="/css/main.css">
  </head>

  <body>
    <h2>
      <a href="index.html">Return to Main Menu</a>
    </h2>
    <hr>
    <br>
    <form action="php/add_game.php" method="post">
      <p>
        <label for="title">Title:</label>
        <input type="text" id="title" name="usertitle" placeholder="Enter the title" maxlength="100">
      </p>
      <p>
        <label for="developer">Developer:</label>
        <input type="text" id="developer" name="userdeveloper" placeholder="Enter the developer" maxlength="50">
      </p>
      <p>
        <label for="hours">Hours Played:</label>
        <input type="number" step="0.1" min="0" max="9999999" id="hours" name="userhours">
      </p>
      <p>
        <label for="review">Review:</label>
        <textarea id="review" name="userreview" rows="4" cols="50" placeholder="Write your review here"></textarea>
      </p>
      <p>
        <input type="submit" value="submit">
      </p>
    </form>
  </body>

</html>
